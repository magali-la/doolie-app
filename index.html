<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js"></script>
    
</head>
<body>
    <h1>Doolie Task Manager</h1>
    <label for="taskName">Task Name</label>
    <input id="taskName" type="text" class="form-control">
    <label for="category">Category</label>
    <select id="category" name="category" class="form-select">
        <option value="">Select a category</option>
        <option value="School">School</option>
        <option value="Chores">Chores</option>
    </select>
    <label for="deadline">Deadline</label>
    <input id="deadline" type="date" class="form-control">
    <label for="status">Status</label>
    <select id="status" name="status" class="form-select">
        <option value="">Select a status</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Overdue">Overdue</option>
    </select>
    <button id="addTaskButton" class="btn btn-lg">Add Task</button>
    <h2>Your Tasks:</h2>
    <div class="row">
        <div class="col"><p>Task</p></div>
        <div class="col"><p>Category</p></div>
        <div class="col"><p>Deadline</p></div>
        <div class="col"><p>Status</p></div>
        <div class="col"><p>Update Status</p></div>
    </div>
    <ul id="taskList" class="list-group">
    </ul>
</body>
</html>
